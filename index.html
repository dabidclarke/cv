<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David’s CV</title>
  <style>
    body {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      font: 16px/1.5 Arial, sans-serif;
      color: #222;
    }
    header { margin-bottom: 1rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    button {
      padding: 0.55rem 0.8rem;
      border: 1px solid #777;
      border-radius: 3px;
      background: #f5f5f5;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button[aria-pressed="true"] { background: #222; color: #fff; }
    iframe { display: block; width: 100%; height: 75vh; border: 1px solid #bbb; }
  </style>
</head>
<body>
  <header>
    <h1>David’s CV</h1>
    <p id="current-cv">David CV 2026</p>
  </header>

  <div class="controls" aria-label="Choose a CV">
    <button type="button" id="cs-button" aria-pressed="true">David CV 2026</button>
    <button type="button" id="non-cs-button" aria-pressed="false">Non Comp Sci CV</button>
  </div>

  <p><a id="download-link" href="David%20CV%202026.pdf" download>Download this CV (PDF)</a></p>
  <iframe id="cv-viewer" src="David%20CV%202026.pdf" title="David CV 2026 PDF"></iframe>

  <script>
    const cvs = {
      cs: {
        file: 'David%20CV%202026.pdf',
        name: 'David CV 2026'
      },
      nonCs: {
        file: 'Non%20Comp%20Sci%20David%20CV%202026.pdf',
        name: 'Non Comp Sci David CV 2026'
      }
    };

    const viewer = document.getElementById('cv-viewer');
    const title = document.getElementById('current-cv');
    const download = document.getElementById('download-link');
    const csButton = document.getElementById('cs-button');
    const nonCsButton = document.getElementById('non-cs-button');

    function showCv(cv, activeButton, inactiveButton) {
      viewer.src = cv.file;
      viewer.title = cv.name + ' PDF';
      title.textContent = cv.name;
      download.href = cv.file;
      download.textContent = 'Download this CV (PDF)';
      activeButton.setAttribute('aria-pressed', 'true');
      inactiveButton.setAttribute('aria-pressed', 'false');
    }

    csButton.addEventListener('click', () => showCv(cvs.cs, csButton, nonCsButton));
    nonCsButton.addEventListener('click', () => showCv(cvs.nonCs, nonCsButton, csButton));
  </script>
</body>
</html>
